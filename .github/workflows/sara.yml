name: SARA Archive

on:
  schedule:
    - cron: '25 */3 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-sara-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute SARA Engine
        run: python sara.py

      - name: Generate Commit Timestamp (IST)
        id: time
        run: echo "TS=$(TZ='Asia/Kolkata' date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.TS }}
          commit_user_name: "ravikiranoffl"
          commit_user_email: "171322216+ravikiranoffl@users.noreply.github.com"
          commit_author: "ravikiranoffl <171322216+ravikiranoffl@users.noreply.github.com>"
          file_pattern: "20*/*.json"
